# =============================================================
#  Gera a animação do "snake" com as suas contribuições.
#  Caminho no repositório: .github/workflows/snake.yml
#  (dentro do repo especial DerickSonda/DerickSonda)
# =============================================================
name: Gera animação do Snake

on:
  # roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar manualmente na aba "Actions"
  workflow_dispatch:
  # roda também quando você der push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar o SVG do snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: Publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
